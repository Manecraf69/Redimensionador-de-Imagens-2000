<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redimensionador de Imagens 2000</title>
    <style>
        body {
            background-color: #1A1A40;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            color: #FF007A;
            margin-top: 30px;
        }
        input, button, select {
            background-color: #282850;
            border: none;
            color: #FF007A;
            padding: 10px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .dimension-input {
            width: 205px;
            min-width: 205px;
            box-sizing: border-box;
        }
        .checkbox-option {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: #FF007A;
            cursor: pointer;
            white-space: nowrap;
        }

        #imagesContainer {
            margin-top: 20px;
        }
        a {
            color: #ffffff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        /* Remove as setas dos input number no Chrome */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* Deixa a página mais organizada para telas com menos de 600px de largura */
        @media (max-width: 600px) {
            input:not([type="checkbox"]), button, select {
                width: calc(100% - 20px);
                box-sizing: border-box;
            }
            input[type="checkbox"] {
                width: auto;
            }
        }

        /* Estilo para os popups de caso de exceção */
        #popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 26, 64, 0.9); /* Fundo semi-transparente */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #popupContent {
            background-color: #282850;
            color: #FF007A;
            border: 2px solid #FF007A;
            padding: 20px;
            text-align: center;
            width: 300px;
            font-family: 'Courier New', Courier, monospace;
        }
        #popupMessage {
            margin-bottom: 20px;
            white-space: pre-line;
        }
        #closePopup {
            background-color: #1A1A40;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        /* Estilo para a barra de progresso da renderização */
        #progressPopup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 26, 64, 0.9); /* Fundo semi-transparente */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #progressContent {
            background-color: #282850;
            color: #FF007A;
            border: 2px solid #FF007A;
            padding: 20px;
            text-align: center;
            width: 300px;
            font-family: 'Courier New', Courier, monospace;
        }
        #progressBar {
            background-color: #1A1A40;
            border: 2px solid #FF007A;
            height: 20px;
            margin-top: 10px;
            position: relative;
            width: 100%;
        }
        #progressBarFill {
            background-color: #FF007A;
            height: 100%;
            width: 0%;
            position: absolute;
            top: 0;
            left: 0;
            transition: width 0.3s;
        }

        /* Adicione esta nova classe */
        .image-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }
        .image-preview img {
            max-width: 100px;
            max-height: 100px;
            margin-right: 10px;
            border: 1px solid #00FFFF;
            cursor: pointer;
        }
        /* Estilo para o fundo escurecido */
        #imageModal {
            display: none;
            height: 100vh;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.8);
        }
        /* Estilo para a imagem no pop-up */
        #imageModal img {
            position: absolute;
            top: 50%; /* Posiciona o centro da imagem no meio da tela verticalmente */
            left: 50%; /* Posiciona o centro da imagem no meio da tela horizontalmente */
            transform: translate(-50%, -50%); /* Ajusta a posição para centralizar a imagem */
            max-width: 80%;
            max-height: 80%;
            margin: auto;
            display: block;
            border: 2px solid #fff;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.7);
            transition: transform 0.25s ease, left 0.25s ease, top 0.25s ease;
            cursor: grab;
        }
        /* Estilo para fechar o pop-up */
        .closeModal {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #ffffff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001; /* Garantir que o botão "X" fique sempre acima da imagem */
            background: transparent;
            margin: 0;
            padding: 0 8px;
            width: auto;
        }

        .closeModal:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        .image-preview img:focus-visible {
            outline: 3px solid #00FFFF;
            outline-offset: 3px;
        }

        #generatedImagesList:empty {
            display: none;
        }

        /* Define o estilo para o placeholder rosa */
        .placeholder-rosa::placeholder {
            color:#ff007ba6;
        }
        /* Define a propriedade pointer-events como none para desativar interações do mouse */
        .desativar-interacao {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>Redimensionador de Imagens 2000</h1>

    <div class="section" style="display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;">
        <label for="imageInput">Escolher imagens:</label>
        <input type="file" id="imageInput" multiple accept="image/*">
    
        <label for="fileType">Transformar em:</label>
        <select id="fileType">
            <option value="original">Manter tipo original</option>
            <option value="png">PNG</option>
            <option value="jpeg">JPEG</option>
            <option value="webp">WebP</option>
        </select>
    
        <label for="imageQuality" id="imageQualityLabel" style="display: none;">Qualidade:</label>
        <select id="imageQuality" style="display: none;">
            <option value="1.0">100%</option>
            <option value="0.9">90%</option>
            <option value="0.8">80%</option>
            <option value="0.7">70%</option>
            <option value="0.6">60%</option>
            <option value="0.5">50%</option>
            <option value="0.4">40%</option>
            <option value="0.3">30%</option>
            <option value="0.2">20%</option>
            <option value="0.1">10%</option>
        </select>
    </div>    

    <div class="section" style="display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;">
        <label for="horizontal">Largura (px):</label>
        <input type="text" id="horizontal" class="dimension-input" maxlength="4" inputmode="numeric" pattern="[0-9]{1,4}" placeholder="Digite um valor">

        <label for="vertical">Altura (px):</label>
        <input type="text" id="vertical" class="dimension-input" maxlength="4" inputmode="numeric" pattern="[0-9]{1,4}" placeholder="Digite um valor">

        <label class="checkbox-option">
            <input type="checkbox" id="keepOriginalSize">
            Manter tamanho original
        </label>
    </div>

    <div class="section" style="display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;">
        <label for="resizeMode">Modo:</label>
        <select id="resizeMode">
            <option value="stretch" selected>Esticar imagem</option>
            <option value="transparent">Adicionar fundo transparente</option>
            <option value="blurred">Adicionar fundo embaçado</option>
        </select>

        <label for="preset">Preset de tamanho:</label>
        <select id="preset">
            <option value="">Personalizado</option>
            <option value="1920x1080">Imagem Full HD (1920x1080)</option>
            <option value="3840x2160">Imagem 4K (3840x2160)</option>
            <option value="1080x1080">Instagram - Quadrado (1080x1080)</option>
            <option value="1080x1350">Instagram - Retrato (1080x1350)</option>
            <option value="1080x566">Instagram - Paisagem (1080x566)</option>
            <option value="320x320">Instagram - Foto de Perfil (320x320)</option>
            <option value="1080x1920">Instagram - Stories (1080x1920)</option>
            <option value="2560x1440">YouTube - Banner (2560x1440)</option>
            <option value="1546x423">YouTube - Área Segura (1546x423)</option>
            <option value="1280x720">YouTube - Thumbnail (1280x720)</option>
            <option value="1200x1200">Facebook - Post Quadrado (1200x1200)</option>
            <option value="1200x630">Facebook - Post Retangular (1200x630)</option>
            <option value="820x312">Facebook - Capa de Página (820x312)</option>
        </select>
    </div>

    <div class="section" style="display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;">
        <button id="generateImages">Gerar Imagens</button>
        <button id="downloadAll" disabled>Baixar Todas as Imagens</button>
        <button id="downloadZip" disabled>Baixar Todas as Imagens em ZIP</button>
        <label style="display:flex; align-items:center; gap:6px; color:#FF007A; cursor:pointer;">
            <input type="checkbox" id="keepOriginalName">
            Manter nome original
        </label>
    </div>

    <div id="imagesContainer" class="section">
        <h2>Lista de imagens geradas:</h2>
        <p id="noImagesMessage">Nenhuma imagem gerada ainda</p>
        <div id="generatedImagesList"></div>
    </div>

    <div id="popup" role="dialog" aria-modal="true" aria-labelledby="popupMessage" style="display: none;">
        <div id="popupContent" tabindex="-1">
            <p id="popupMessage">Nenhuma imagem gerada ainda!</p>
            <button id="closePopup">Fechar</button>
        </div>
    </div>
    
    <div id="progressPopup" role="dialog" aria-modal="true" aria-labelledby="progressMessage" aria-live="polite" style="display: none;">
        <div id="progressContent" tabindex="-1">
            <p id="progressMessage">Gerando imagens...</p>
            <div id="progressBar" role="progressbar" aria-label="Progresso da geração" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="progressBarFill"></div>
            </div>
        </div>
    </div>

    <!-- Modal para visualização de imagem -->
    <div id="imageModal" role="dialog" aria-modal="true" aria-label="Visualização ampliada da imagem">
        <button type="button" class="closeModal" aria-label="Fechar visualização">&times;</button>
        <img id="modalImage" alt="Pré-visualização ampliada">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        const generatedImagesList = document.getElementById('generatedImagesList');
        const noImagesMessage = document.getElementById('noImagesMessage');
        const downloadAllButton = document.getElementById('downloadAll');
        const generateImagesButton = document.getElementById('generateImages');
        const downloadZipButton = document.getElementById('downloadZip');
        const FORMAT_CONFIG = {
            png: { mime: 'image/png', extension: 'png' },
            jpeg: { mime: 'image/jpeg', extension: 'jpg' },
            webp: { mime: 'image/webp', extension: 'webp' }
        };
        const MIME_FORMATS = { 'image/png': 'png', 'image/jpeg': 'jpeg', 'image/webp': 'webp' };
        const objectUrls = new Set();
        let generatedImages = [];
        let generationId = 0;
        let lastGenerationDescription = 'Imagens Redimensionadas';
        let previouslyFocusedElement = null;

        let totalImages = 0;
        let processedImages = 0;
        let imageProgress = [];

        // Variáveis para controle do zoom
        let modalImg = document.getElementById('modalImage');
        let scale = 1;
        const MIN_SCALE = 1;
        const MAX_SCALE = 6;
        const ZOOM_SPEED = 0.1;
        let lastTouchDistance = null;

        let isDragging = false;
        let initialX, initialY;
        let offsetX = 0, offsetY = 0;

        const horizontalInput = document.getElementById('horizontal');
        const verticalInput = document.getElementById('vertical');
        const keepOriginalSizeInput = document.getElementById('keepOriginalSize');

        function updateOriginalSizeState() {
            const keepOriginalSize = keepOriginalSizeInput.checked;
            horizontalInput.disabled = keepOriginalSize;
            verticalInput.disabled = keepOriginalSize;
            horizontalInput.placeholder = keepOriginalSize ? 'Original' : 'Digite um valor';
            verticalInput.placeholder = keepOriginalSize ? 'Original' : 'Digite um valor';
            horizontalInput.classList.toggle('placeholder-rosa', keepOriginalSize);
            verticalInput.classList.toggle('placeholder-rosa', keepOriginalSize);
            horizontalInput.classList.toggle('desativar-interacao', keepOriginalSize);
            verticalInput.classList.toggle('desativar-interacao', keepOriginalSize);

            if (keepOriginalSize) {
                horizontalInput.value = '';
                verticalInput.value = '';
                document.getElementById('preset').value = '';
            }
        }

        keepOriginalSizeInput.addEventListener('change', updateOriginalSizeState);

        // Preset de Tamanho de Imagem
        document.getElementById('preset').addEventListener('change', function() {
            keepOriginalSizeInput.checked = false;
            updateOriginalSizeState();

            const presetValues = this.value.split('x');
            if (presetValues.length === 2) {
                horizontalInput.value = presetValues[0];
                verticalInput.value = presetValues[1];
            }
        });

        // Gera Imagens ao Clicar no Botão
        generateImagesButton.addEventListener('click', function() {
            document.getElementById('progressBarFill').style.width = '0%'; // Zera a barra de progresso
            document.getElementById('progressBar').setAttribute('aria-valuenow', '0');
            document.getElementById('progressMessage').textContent = 'Gerando imagens...';

            if (document.getElementById('imageInput').files.length === 0) {
                showPopup('Selecione ao menos uma imagem para gerar.');
                return;
            }

            const files = document.getElementById('imageInput').files;

            const width = Number(document.getElementById('horizontal').value);
            const height = Number(document.getElementById('vertical').value);

            const resizeMode = document.getElementById('resizeMode').value;
            const keepOriginalSize = keepOriginalSizeInput.checked;
            const keepOriginalName = document.getElementById('keepOriginalName').checked;
            const imageQuality = Number(document.getElementById('imageQuality').value);

            if (!keepOriginalSize && (!Number.isInteger(width) || !Number.isInteger(height) || width < 1 || height < 1 || width > 5000 || height > 5000)) {
                showPopup('A largura e a altura devem ser números inteiros entre 1 e 5000.');
                return;
            }

            const fileType = document.getElementById('fileType').value;

            releaseObjectUrls();
            generatedImagesList.replaceChildren();
            noImagesMessage.style.display = 'none';
            generatedImages = new Array(files.length);
            totalImages = files.length;
            processedImages = 0;
            imageProgress = new Array(totalImages).fill(0);
            const currentGenerationId = ++generationId;
            const processingMessages = [];
            const usedFileNames = new Set();
            const resultSlots = Array.from({ length: totalImages }, () => document.createElement('div'));
            generatedImagesList.append(...resultSlots);
            lastGenerationDescription = keepOriginalSize
                ? 'Imagens em Tamanho Original'
                : `Imagens Redimensionadas (${width}x${height})`;

            showProgressPopup(); // Mostra o pop-up de progresso
            generateImagesButton.disabled = true;
            downloadAllButton.disabled = true;
            downloadZipButton.disabled = true;

            const finishImage = (index, message = '') => {
                if (currentGenerationId !== generationId || imageProgress[index] === 100) return;

                if (message) processingMessages.push(message);
                imageProgress[index] = 100;
                processedImages++;
                updateProgressBar();

                if (processedImages === totalImages) {
                    const hasGeneratedImages = generatedImages.some(Boolean);
                    generateImagesButton.disabled = false;
                    downloadAllButton.disabled = !hasGeneratedImages;
                    downloadZipButton.disabled = !hasGeneratedImages;
                    closeProgressPopup();
                    noImagesMessage.style.display = hasGeneratedImages ? 'none' : 'block';

                    if (processingMessages.length > 0) {
                        showPopup(processingMessages.join('\n'));
                    }
                }
            };

            Array.from(files).forEach((file, index) => {
                const originalFileSize = file.size; // Tamanho do arquivo original em bytes
                const img = new Image();
                const sourceUrl = URL.createObjectURL(file);
                img.onerror = function() {
                    URL.revokeObjectURL(sourceUrl);
                    finishImage(index, `O arquivo "${file.name}" não é uma imagem válida ou suportada.`);
                };

                img.onload = function() {
                    URL.revokeObjectURL(sourceUrl);
                    if (currentGenerationId !== generationId) return;

                    try {

                    if (keepOriginalSize && (img.width > 5000 || img.height > 5000)) {
                        finishImage(index, `"${file.name}" ultrapassa o limite de 5000 px.`);
                        return;
                    }

                    let outputFormat = fileType;
                    if (fileType === 'original') {
                        outputFormat = MIME_FORMATS[file.type.toLowerCase()] || 'png';
                        if (!MIME_FORMATS[file.type.toLowerCase()]) {
                            processingMessages.push(`"${file.name}" foi convertido para PNG porque seu formato original não pode ser exportado pelo navegador.`);
                        }
                    }
                    const format = FORMAT_CONFIG[outputFormat];
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    if (!ctx) throw new Error('Canvas 2D indisponível.');

                    // Configura o tamanho do canvas
                    if (keepOriginalSize) {
                        canvas.width = img.width;
                        canvas.height = img.height;
                    } else {
                        canvas.width = width;
                        canvas.height = height;
                    }

                    if (format.mime === 'image/jpeg') {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }

                    // Desenha a imagem no canvas
                    if (keepOriginalSize) {
                        ctx.drawImage(img, 0, 0);
                    } else if (resizeMode === 'stretch') {
                        ctx.drawImage(img, 0, 0, width, height);
                    } else {
                        const scale = Math.min(width / img.width, height / img.height);
                        const finalWidth = img.width * scale;
                        const finalHeight = img.height * scale;
                        const offsetX = (width - finalWidth) / 2;
                        const offsetY = (height - finalHeight) / 2;

                        if (resizeMode === 'blurred') {
                            const bgScale = Math.max(width / img.width, height / img.height);
                            const bgWidth = img.width * bgScale;
                            const bgHeight = img.height * bgScale;
                            const bgX = (width - bgWidth) / 2;
                            const bgY = (height - bgHeight) / 2;

                            ctx.filter = 'blur(24px)';
                            ctx.drawImage(img, bgX, bgY, bgWidth, bgHeight);
                            ctx.filter = 'none';
                        }

                        ctx.drawImage(img, offsetX, offsetY, finalWidth, finalHeight);
                    }

                    // Determina o novo nome do arquivo
                    const originalBaseName = file.name.replace(/\.[^/.]+$/, '');
                    const fileExtension = format.extension;
                    let newFileName;

                    if (keepOriginalName) {
                        newFileName = `${originalBaseName}.${fileExtension}`;
                    } else {
                        if (keepOriginalSize) {
                            newFileName = `${originalBaseName} (${img.width}x${img.height}).${fileExtension}`;
                        } else {
                            newFileName = `${originalBaseName} (${width}x${height}).${fileExtension}`;
                        }
                    }
                    newFileName = createUniqueFileName(newFileName, usedFileNames);

                        // Cria um link para download da imagem
                        canvas.toBlob(blob => {
                            if (currentGenerationId !== generationId) return;

                            if (blob && blob.type === format.mime) {
                                // Obtém o tamanho do novo arquivo
                                const newFileSize = blob.size;

                                // Atualiza o progresso individual e total
                                const downloadLink = document.createElement('a');
                                const objectUrl = URL.createObjectURL(blob);
                                objectUrls.add(objectUrl);
                                downloadLink.href = objectUrl;
                                downloadLink.download = newFileName;
                                
                                // Formatação dos tamanhos (de bytes para KB ou MB)
                                const formatFileSize = (size) => {
                                    if (size < 1024) return `${size} bytes`;
                                    if (size < 1048576) return `${(size / 1024).toFixed(2)} KB`;
                                    return `${(size / 1048576).toFixed(2)} MB`;
                                };

                                const downloadLabel = document.createElement('span');
                                downloadLabel.style.color = '#00FFFF';
                                downloadLabel.textContent = 'Baixar: ';
                                const fileNameLabel = document.createElement('span');
                                fileNameLabel.style.color = 'white';
                                fileNameLabel.textContent = newFileName;
                                const sizeLabel = document.createElement('span');
                                sizeLabel.style.color = '#00FFFF';
                                sizeLabel.textContent = `(Antes: ${formatFileSize(originalFileSize)}, Depois: ${formatFileSize(newFileSize)})`;
                                downloadLink.append(downloadLabel, fileNameLabel, document.createElement('br'), sizeLabel);

                                // Cria o contêiner da pré-visualização
                                const previewContainer = document.createElement('div');
                                previewContainer.classList.add('image-preview');
                                
                                // Adiciona a pré-visualização da imagem
                                const previewImage = document.createElement('img');
                                previewImage.src = objectUrl;
                                previewImage.alt = `Pré-visualização de ${newFileName}`;
                                previewImage.tabIndex = 0;
                                previewImage.addEventListener('click', function() {
                                    openImageModal(previewImage.src);
                                });
                                previewImage.addEventListener('keydown', function(event) {
                                    if (event.key === 'Enter' || event.key === ' ') {
                                        event.preventDefault();
                                        openImageModal(previewImage.src);
                                    }
                                });
                                previewContainer.appendChild(previewImage);

                                // Adiciona o link de download
                                previewContainer.appendChild(downloadLink);

                                // Adiciona o contêiner ao DOM
                                resultSlots[index].replaceChildren(previewContainer);

                                generatedImages[index] = { name: newFileName, blob, url: objectUrl };
                                finishImage(index);
                            } else {
                                finishImage(index, `Não foi possível converter "${file.name}" para ${format.extension.toUpperCase()}.`);
                            }
                        }, format.mime, ['jpeg', 'webp'].includes(outputFormat) ? imageQuality : undefined);
                    } catch (error) {
                        console.error(error);
                        finishImage(index, `Ocorreu um erro ao processar "${file.name}".`);
                    }
                };
                img.src = sourceUrl;
            });
        });

        // Baixar Todas as Imagens
        downloadAllButton.addEventListener('click', function() {
            const availableImages = generatedImages.filter(Boolean);
            if (availableImages.length === 0) {
                showPopup('Nenhuma imagem foi gerada para baixar.');
                return;
            }

            availableImages.forEach(({ url, name }) => {
                const a = document.createElement('a');
                a.href = url;
                a.download = name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });
        });

        // Baixar Todas as Imagens em ZIP
        downloadZipButton.addEventListener('click', async function() {
            const availableImages = generatedImages.filter(Boolean);
            if (availableImages.length === 0) {
                showPopup('Nenhuma imagem foi gerada para baixar em ZIP.');
                return;
            }

            if (typeof JSZip === 'undefined') {
                showPopup('Não foi possível carregar o gerador de ZIP. Verifique sua conexão e tente novamente.');
                return;
            }

            downloadZipButton.disabled = true;
            try {
                const zip = new JSZip();
                availableImages.forEach(({ name, blob }) => zip.file(name, blob));
                const content = await zip.generateAsync({ type: 'blob' });
                const zipUrl = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = zipUrl;
                a.download = `${lastGenerationDescription}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(zipUrl), 1000);
            } catch (error) {
                console.error(error);
                showPopup('Não foi possível criar o arquivo ZIP.');
            } finally {
                downloadZipButton.disabled = false;
            }
        });

        // Mostrar ou esconder o controle de qualidade do JPEG e WebP
        document.getElementById('fileType').addEventListener('change', function() {
            const imageQualityLabel = document.getElementById('imageQualityLabel');
            const imageQualitySelect = document.getElementById('imageQuality');
            const showQuality = ['jpeg', 'webp'].includes(this.value);
            imageQualityLabel.style.display = showQuality ? 'inline' : 'none';
            imageQualitySelect.style.display = showQuality ? 'inline' : 'none';
        });

        function createUniqueFileName(fileName, usedNames) {
            if (!usedNames.has(fileName.toLowerCase())) {
                usedNames.add(fileName.toLowerCase());
                return fileName;
            }

            const dotIndex = fileName.lastIndexOf('.');
            const baseName = dotIndex > 0 ? fileName.slice(0, dotIndex) : fileName;
            const extension = dotIndex > 0 ? fileName.slice(dotIndex) : '';
            let suffix = 2;
            let candidate;

            do {
                candidate = `${baseName} (${suffix++})${extension}`;
            } while (usedNames.has(candidate.toLowerCase()));

            usedNames.add(candidate.toLowerCase());
            return candidate;
        }

        function releaseObjectUrls() {
            objectUrls.forEach(url => URL.revokeObjectURL(url));
            objectUrls.clear();
        }

        // Função para mostrar o pop-up de caso de exceção
        function showPopup(message) {
            const popup = document.getElementById('popup');
            const popupMessage = document.getElementById('popupMessage');
            const activeElement = document.activeElement;
            if (activeElement && activeElement !== document.body && activeElement.offsetParent !== null) {
                previouslyFocusedElement = activeElement;
            }
            popupMessage.textContent = message;
            popup.style.display = 'flex';
            document.getElementById('closePopup').focus();
        }

        // Função para fechar o pop-up de caso de exceção
        document.getElementById('closePopup').addEventListener('click', function() {
            document.getElementById('popup').style.display = 'none';
            previouslyFocusedElement?.focus();
        });

        // Função para mostrar o pop-up de progresso
        function showProgressPopup() {
            previouslyFocusedElement = document.activeElement;
            document.getElementById('progressPopup').style.display = 'flex';
            document.getElementById('progressContent').focus();
        }

        // Função para atualizar a barra de progresso
        function updateProgressBar() {
            const totalProgress = imageProgress.reduce((sum, progress) => sum + progress, 0) / totalImages;
            document.getElementById('progressBarFill').style.width = `${totalProgress}%`;
            const progressBar = document.getElementById('progressBar');
            progressBar.setAttribute('aria-valuenow', Math.round(totalProgress));
            document.getElementById('progressMessage').textContent = `Gerando imagens... ${processedImages} de ${totalImages}`;
        }

        // Função para fechar o pop-up de progresso
        function closeProgressPopup() {
            document.getElementById('progressPopup').style.display = 'none';
            previouslyFocusedElement?.focus();
        }

        // Função para abrir o modal com a imagem em tamanho maior
        function openImageModal(src) {
            const modal = document.getElementById('imageModal');
            previouslyFocusedElement = document.activeElement;
            resetZoom();
            modalImg.src = src;
            modal.style.display = "block";
            document.querySelector('.closeModal').focus();
        }

        function closeImageModal() {
            document.getElementById('imageModal').style.display = 'none';
            resetZoom();
            previouslyFocusedElement?.focus();
        }

        // Fechar o modal ao clicar no "X"
        document.querySelector('.closeModal').addEventListener('click', closeImageModal);

        // Fechar o modal ao clicar fora da imagem
        document.getElementById('imageModal').addEventListener('click', function(event) {
            if (event.target === document.getElementById('imageModal')) {
                closeImageModal();
            }
        });

        // Função para aplicar o zoom in, focando no centro da tela
        function applyZoom(e) {
            e.preventDefault();

            if (scale === 1) {
                scale = 1.5;
            } else if (scale === 1.5) {
                scale = 2;
            } else {
                scale = 1;
                offsetX = 0;
                offsetY = 0;
            }
            updateTransform();
        }
        // Detectar o duplo toque em dispositivos móveis
        let lastTouchEnd = 0;
        modalImg.addEventListener('touchend', function(e) {
            const now = new Date().getTime();
            if (now - lastTouchEnd <= 300) {
                applyZoom(e);
            }
            lastTouchEnd = now;
        });
        // Adicionar o evento para desktop e mobile
        modalImg.addEventListener('dblclick', applyZoom);

        // Função para resetar o zoom ao fechar o modal ou ao clicar novamente na imagem
        function resetZoom() {
            scale = 1;
            offsetX = 0;
            offsetY = 0;
            modalImg.style.marginLeft = '0px';
            modalImg.style.marginTop = '0px';
            updateTransform();
        }

        function updateTransform() {
            modalImg.style.transform =
                `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px)) scale(${scale})`;
        }

        // Prevenir comportamento padrão de arraste da imagem
        modalImg.addEventListener('dragstart', function(e) {
            e.preventDefault();
        });

        modalImg.addEventListener('drag', function(e) {
            e.preventDefault();
        });

        // Função para iniciar o movimento (mouse e toque)
        function startDrag(e) {
            if (e.touches && e.touches.length !== 1) {
                isDragging = false;
                return;
            }
            e.preventDefault();
            isDragging = true;
            initialX = e.type === 'mousedown' ? e.clientX : e.touches[0].clientX;
            initialY = e.type === 'mousedown' ? e.clientY : e.touches[0].clientY;
            modalImg.style.cursor = 'grabbing';
        }

        // Função para mover a imagem (mouse e toque)
        function moveImage(e) {
            if (isDragging) {
                const currentX = e.type === 'mousemove' ? e.clientX : e.touches[0].clientX;
                const currentY = e.type === 'mousemove' ? e.clientY : e.touches[0].clientY;

                const deltaX = currentX - initialX;
                const deltaY = currentY - initialY;

                offsetX += deltaX;
                offsetY += deltaY;
                updateTransform();

                // Atualiza as posições iniciais para o próximo movimento
                initialX = currentX;
                initialY = currentY;
            }
        }

        // Função para parar o movimento (mouse e toque)
        function stopDrag() {
            isDragging = false;
            modalImg.style.cursor = 'grab';
        }

        // Adiciona os eventos para mouse e toque
        modalImg.addEventListener('mousedown', startDrag);
        modalImg.addEventListener('touchstart', startDrag);

        modalImg.addEventListener('mousemove', moveImage);
        modalImg.addEventListener('touchmove', moveImage);

        modalImg.addEventListener('mouseup', stopDrag);
        modalImg.addEventListener('touchend', stopDrag);

        // Parar o movimento se o mouse sair da imagem
        modalImg.addEventListener('mouseleave', function() {
            isDragging = false;
            modalImg.style.cursor = 'grab';
        });

        function handleDimensionInput() {
            this.value = this.value
                .replace(/\D/g, '')
                .slice(0, 4)
                .replace(/^0+(?=\d)/, '');
            document.getElementById('preset').value = '';
        }

        horizontalInput.addEventListener('input', handleDimensionInput);
        verticalInput.addEventListener('input', handleDimensionInput);

        modalImg.addEventListener('wheel', function (e) {
            e.preventDefault();

            const delta = e.deltaY < 0 ? 1 : -1;
            let newScale = scale + delta * ZOOM_SPEED;

            newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));

            if (newScale === scale) return;

            scale = newScale;
            updateTransform();
        }, { passive: false });

        modalImg.addEventListener('touchmove', function (e) {
            if (e.touches.length === 2) {
                e.preventDefault();

                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (lastTouchDistance) {
                    let zoomChange = (distance - lastTouchDistance) * 0.005;
                    let newScale = scale + zoomChange;

                    newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
                    scale = newScale;
                    updateTransform();
                }

                lastTouchDistance = distance;
            }
        }, { passive: false });

        modalImg.addEventListener('touchend', function (event) {
            if (event.touches.length < 2) {
                lastTouchDistance = null;
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key !== 'Escape') return;

            if (document.getElementById('imageModal').style.display === 'block') {
                closeImageModal();
            } else if (document.getElementById('popup').style.display === 'flex') {
                document.getElementById('popup').style.display = 'none';
                previouslyFocusedElement?.focus();
            }
        });

        window.addEventListener('beforeunload', releaseObjectUrls);
    </script>
</body>
</html>
